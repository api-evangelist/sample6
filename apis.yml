name: Sample6
description: >-
  Sample6 was a food-safety technology company (a Canaan Partners portfolio
  company) that developed rapid, bioluminescence-based pathogen detection and
  environmental monitoring products for the food industry, aimed at catching
  contamination such as Listeria, Salmonella, and E. coli before product
  shipped. The business was acquired and absorbed into IEH Laboratories &
  Consulting Group; the sample6.com domain now redirects to iehinc.com. No
  independent developer portal, public API, or machine-readable API artifacts
  survive, so this record is retained as a historical company profile rather
  than an active API provider.
